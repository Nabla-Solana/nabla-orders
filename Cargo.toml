[workspace]
members = ["programs/nabla-orders", "programs/mock-swap"]
resolver = "2"

[profile.release]
# Size first: the deploy rent is paid per byte of program.
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
