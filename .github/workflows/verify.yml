name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install solana-verify
        run: cargo install solana-verify --version 0.5.2 --locked
      - name: Build in solana-verify's container
        run: solana-verify build --arch v3 --library-name nabla_orders --base-image solanafoundation/solana-verifiable-build:4.3.0@sha256:12fd4c0a0790f0fc41ef74b0cdb6bccc167ba6137eb1adb749bac649481c86bd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nabla_orders
          path: target/deploy/nabla_orders.so
      - name: Compare with the program on mainnet
        run: |
          built=$(solana-verify get-executable-hash target/deploy/nabla_orders.so)
          live=$(solana-verify get-program-hash -u https://api.mainnet-beta.solana.com AAAtde5ZAg136H2RrNtMohS7k8AVprbGBBEqhT1S8uGA)
          printf '| | sha256 |\n| --- | --- |\n| Built from this source | `%s` |\n| On mainnet | `%s` |\n' "$built" "$live" >> "$GITHUB_STEP_SUMMARY"
          test "$built" = "$live"
